name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Express smoke test
        run: npm run test:smoke

  ci-pass:
    name: CI Passed
    runs-on: ubuntu-latest
    needs: [lint, smoke-test]
    if: always()

    steps:
      - run: |
          echo "Lint: ${{ needs.lint.result }}"
          echo "Smoke: ${{ needs.smoke-test.result }}"

          if [[ "${{ needs.lint.result }}" == "failure" || "${{ needs.smoke-test.result }}" == "failure" ]]; then
            exit 1
          fi
