name: 🗄️ Backend & Database Compatibility Check

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  compatibility-check:
    runs-on: ubuntu-latest

    steps:
      - name: Analyze Changed Files
        uses: actions/github-script@v8
        with:
          script: |
            const pr = context.payload.pull_request;

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                per_page: 100
              }
            );

            let backendFiles = [];
            let databaseFiles = [];

            for (const file of files) {
              const name = file.filename;

              // Backend
              if (
                name.startsWith("backend/") ||
                name.startsWith("server/") ||
                name.startsWith("api/")
              ) {
                backendFiles.push(name);
              }

              // Database / Migrations
              if (
                name.includes("migration") ||
                name.includes("migrations") ||
                name.includes("schema") ||
                name.endsWith(".sql") ||
                name.includes("database") ||
                name.includes("db/")
              ) {
                databaseFiles.push(name);
              }
            }

            if (backendFiles.length === 0 || databaseFiles.length === 0) {
              console.log("No backend + database combination detected.");
              return;
            }

            // Add labels
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: [
                "backend",
                "database",
                "migration-review"
              ]
            });

            const body = `## ⚠️ Backend & Database Compatibility Warning

            This Pull Request modifies **both backend logic and database-related files**.

            ### Backend Files

            ${backendFiles.map(f => `- \`${f}\``).join("\n")}

            ### Database Files

            ${databaseFiles.map(f => `- \`${f}\``).join("\n")}

            ---

            ## Migration Review Checklist

            - [ ] Database migrations tested
            - [ ] Existing data remains compatible
            - [ ] No breaking schema changes
            - [ ] Backend queries updated
            - [ ] Rollback strategy verified
            - [ ] API compatibility checked
            - [ ] Documentation updated (if required)

            ### Why this matters

            Backend and database changes often need to be deployed together.
            Please verify that the application works correctly with both the old
            and new database schema before merging.

            ---
            *Generated automatically by Backend & Database Compatibility Check.*`;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number
            });

            const existing = comments.data.find(c =>
              c.body.includes("Backend & Database Compatibility Check.")
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body
              });
            }
